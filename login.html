<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePost | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-container {
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            width: 100%; max-width: 400px; padding: 40px;
            border: 1px solid var(--border); border-radius: 16px; text-align: center;
        }
        .login-card h1 { margin-bottom: 30px; font-weight: 800; }
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .input-group input {
            width: 100%; padding: 12px; border: 1px solid var(--border);
            border-radius: 8px; outline: none;
        }
        .btn-full { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>SimplePost</h1>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="example@gmail.com">
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••">
            </div>
            <button class="btn-primary btn-full" id="loginBtn">Log In</button>
            <p style="margin-top: 20px; font-size: 14px; color: var(--secondary);">
                Don't have an account? <a href="#" style="color: var(--primary); font-weight: 600;">Sign Up</a>
            </p>
        </div>
    </div>
</body>
</html>
