<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePost | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; padding: 30px; border: 1px solid var(--border); border-radius: 15px; text-align: center; }
        .login-box h2 { margin-bottom: 20px; font-weight: 800; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 8px; outline: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>SimplePost</h2>
        <input type="email" id="email" placeholder="Email của bạn">
        <input type="password" id="password" placeholder="Mật khẩu">
        <button id="loginBtn" class="btn-primary" style="width: 100%; margin-top: 10px;">Đăng nhập / Đăng ký</button>
        <p id="status" style="margin-top: 15px; font-size: 14px; color: red;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // DÁN CONFIG CỦA SAYHI VÀO ĐÂY
        const firebaseConfig = {
            apiKey: "AIzaSyAzn2X18AOgN59nc1O_RnHT2AJDRINYu7M",
            authDomain: "sayhiwithme-0000002.firebaseapp.com",
            projectId: "sayhiwithme-0000002",
            storageBucket: "sayhiwithme-0000002.firebasestorage.app",
            messagingSenderId: "330846125548",
            appId: "1:330846125548:web:f308385a1aa261e06bd4c9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        document.getElementById('loginBtn').addEventListener('click', () => {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            
            // Thử đăng nhập, nếu chưa có tài khoản thì tự tạo mới luôn cho tiện
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => { window.location.href = 'index.html'; })
                .catch(() => {
                    createUserWithEmailAndPassword(auth, email, pass)
                        .then(() => { window.location.href = 'index.html'; })
                        .catch(err => { document.getElementById('status').innerText = "Lỗi: " + err.message; });
                });
        });
    </script>
</body>
</html>
