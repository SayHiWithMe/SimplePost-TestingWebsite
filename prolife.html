<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePost | Profile</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-header { text-align: center; padding: 40px 0; border-bottom: 1px solid var(--border); }
        .avatar { width: 100px; height: 100px; border-radius: 50%; background: #eee; margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 40px; border: 2px solid var(--primary); }
        .stats { display: flex; justify-content: center; gap: 40px; margin-top: 20px; }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 1.2rem; display: block; }
        .stat-label { color: var(--secondary); font-size: 14px; }
        .user-posts-title { margin: 30px 0 15px; font-weight: 800; border-bottom: 2px solid var(--primary); display: inline-block; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">SimplePost</a>
            <a href="index.html" class="nav-link">← Back to Feed</a>
        </div>
    </nav>

    <main class="container">
        <section class="profile-header">
            <div class="avatar">👋</div>
            <h1 id="userName">SayHiWithMe</h1>
            <p id="userBio">Programmer | Animator | SimplePost Creator</p>
            
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-value" id="postCount">0</span>
                    <span class="stat-label">Posts</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="totalLikes">0</span>
                    <span class="stat-label">Total Likes</span>
                </div>
            </div>
        </section>

        <h3 class="user-posts-title">Your Posts</h3>
        <div id="userFeed">
            </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Dán Config của SayHi vào đây
        const firebaseConfig = {
            apiKey: "AIzaSyAzn2X18AOgN59nc1O_RnHT2AJDRINYu7M",
            authDomain: "sayhiwithme-0000002.firebaseapp.com",
            databaseURL: "https://sayhiwithme-0000002-default-rtdb.asia-southeast1.firebasedatabase.app/",
            projectId: "sayhiwithme-0000002",
            storageBucket: "sayhiwithme-0000002.firebasestorage.app",
            messagingSenderId: "330846125548",
            appId: "1:330846125548:web:f308385a1aa261e06bd4c9"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const userFeed = document.getElementById('userFeed');

        // Lấy dữ liệu và lọc bài viết của SayHiWithMe
        onValue(ref(db, 'posts'), (snapshot) => {
            const data = snapshot.val();
            let count = 0;
            let likes = 0;
            userFeed.innerHTML = '';

            if (data) {
                Object.keys(data).forEach(id => {
                    const post = data[id];
                    // Chỉ lấy bài của bạn
                    if(post.user === "SayHiWithMe") {
                        count++;
                        likes += (post.likes || 0);
                        
                        const div = document.createElement('div');
                        div.className = 'post';
                        div.innerHTML = `
                            <div class="post-content">${post.content}</div>
                            <div class="post-actions">❤️ ${post.likes || 0} Likes</div>
                        `;
                        userFeed.prepend(div);
                    }
                });
            }
            document.getElementById('postCount').innerText = count;
            document.getElementById('totalLikes').innerText = likes;
        });
    </script>
</body>
</html>
