<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimplePost | Feed</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="logo">SimplePost</a>
            
            <div class="search-container">
                <input type="text" placeholder="Tìm kiếm bài viết..." id="searchInput">
            </div>

            <div class="nav-actions">
                <a href="profile.html" class="nav-link">Profile</a>
                <button id="logoutBtn" class="btn-secondary">Logout</button>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="create-post-card">
            <textarea id="postInput" placeholder="SayHi đang nghĩ gì thế?"></textarea>
            <div class="card-footer">
                <span class="char-count" id="charCount">0/280</span>
                <button id="submitPost" class="btn-primary">Post</button>
            </div>
        </section>

        <div id="feedContainer">
            <p style="text-align: center; color: #888; margin-top: 20px;">Đang tải bài viết...</p>
        </div>
    </main>

    <script type="module" src="script.js"></script>

    <script>
        const textarea = document.getElementById('postInput');
        const charCount = document.getElementById('charCount');
        textarea.addEventListener('input', () => {
            charCount.textContent = `${textarea.value.length}/280`;
            if(textarea.value.length > 280) charCount.style.color = 'red';
            else charCount.style.color = '#888';
        });
    </script>
</body>
</html>
